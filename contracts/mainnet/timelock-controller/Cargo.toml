[package]
name = "ackrate-timelock-controller"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]
deployed-v2-test = []

[dependencies]
soroban-sdk = { version = "=26.1.0", features = ["hazmat-address"] }
stellar-governance = "=0.7.2"

[dev-dependencies]
soroban-sdk = { version = "=26.1.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
lto = true
panic = "abort"
codegen-units = 1
