name: Mainnet V2 Source Verification

on:
  push:
    tags:
      - 'v2-source-verify-v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  exact-source-and-byte-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require the reviewed StellarExpert builder behind its canonical identity
        env:
          EXPECTED_BUILDER_SHA: 88068ec50cba931a96436869727ed08edeb76ade
        run: |
          set -euo pipefail
          actual="$(git ls-remote https://github.com/stellar-expert/soroban-build-workflow.git refs/heads/main | awk '{print $1}')"
          test "$actual" = "$EXPECTED_BUILDER_SHA"
      - name: Install the reviewed Rust contract toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target wasm32v1-none
      - name: Install the verified Stellar CLI 27.0.0 release
        env:
          STELLAR_CLI_SHA256: 357bf712f6353c28cd33c794402a3c87231757a5b305e6ef1604365af4fdd556
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stellar-cli-27.0.0.tar.gz"
          bin_dir="$RUNNER_TEMP/stellar-cli-bin"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$STELLAR_CLI_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/stellar" --version
      - name: Require the reviewed tests and exact Mainnet V2 bytes
        env:
          EXPECTED_WASM_SHA256: 982809197d35d44c7b0fce6bd117fb2fec09b728c64c146c1f803b01faacff62
        run: |
          set -euo pipefail
          contract=contracts/mainnet-v2/mandate-registry
          stellar contract build \
            --manifest-path "$contract/Cargo.toml" \
            --package mandate-registry \
            --locked \
            --optimize \
            --meta source_repo=github:ackrate/ackrate-protocol-contracts \
            --meta home_domain=ackrate.xyz
          wasm="$GITHUB_WORKSPACE/$contract/target/wasm32v1-none/release/mandate_registry.wasm"
          echo "$EXPECTED_WASM_SHA256  $wasm" | sha256sum --check --strict
          MAINNET_V2_RELEASE_WASM="$wasm" cargo test \
            --manifest-path "$contract/Cargo.toml" \
            --locked \
            --all-features \
            -- --include-ignored

  publish-canonical-source-proof:
    needs: exact-source-and-byte-gate
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Canonical StellarExpert source proof for ACKRATE T3 Step 1 Mainnet V2 MandateRegistry'
      relative_path: 'contracts/mainnet-v2/mandate-registry'
      package: 'mandate-registry'
      home_domain: 'ackrate.xyz'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  requeue-explorer-match-after-proof:
    needs: publish-canonical-source-proof
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Wait for the exact attestation to be readable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_WASM_SHA256: 982809197d35d44c7b0fce6bd117fb2fec09b728c64c146c1f803b01faacff62
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/attestations/sha256:${EXPECTED_WASM_SHA256}"
          for attempt in $(seq 1 20); do
            payload="$(gh api "$endpoint" --jq '.attestations[0].bundle.dsseEnvelope.payload')"
            commit="$(printf '%s' "$payload" | base64 --decode | jq -r '.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit')"
            if [ "$commit" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "The expected canonical attestation did not become readable in time." >&2
          exit 1
      - name: Requeue the StellarExpert source match after attestation
        env:
          CONTRACT_HASH: 982809197d35d44c7b0fce6bd117fb2fec09b728c64c146c1f803b01faacff62
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg commitHash "$GITHUB_SHA" \
            --arg jobId "build" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg contractHash "$CONTRACT_HASH" \
            --arg relativePath "contracts/mainnet-v2/mandate-registry" \
            --arg packageName "mandate-registry" \
            '{repository: $repository, commitHash: $commitHash, jobId: $jobId, runId: $runId, contractHash: $contractHash, relativePath: $relativePath, packageName: $packageName}' \
            > "$RUNNER_TEMP/source-match.json"
          for attempt in $(seq 1 20); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'content-type: application/json' \
              --data-binary "@$RUNNER_TEMP/source-match.json" \
              'https://api.stellar.expert/explorer/public/contract-validation/match')"
            if jq -e '.ok == 1' <<<"$response" >/dev/null; then
              echo 'StellarExpert accepted the source match into its validation queue.'
              exit 0
            fi
            echo "StellarExpert did not acknowledge queue insertion (attempt $attempt/20): $response" >&2
            sleep 30
          done
          echo 'StellarExpert never returned the required {"ok":1} queue acknowledgment.' >&2
          exit 1
