name: Verify live Mainnet canary

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

env:
  RPC_URL: https://mainnet.sorobanrpc.com
  NETWORK_PASSPHRASE: Public Global Stellar Network ; September 2015
  REGISTRY_ID: CDBTG5ZKASFA7LOYUPBOTGKAVX5MJIM4U24BYGX7VX23IHYDAHLQPAGS
  REGISTRY_SHA256: 3656430ac7cf5e7cf1c26948b46314c37866c2d7e928ea89d7d1f89b8aa0ef3c
  TIMELOCK_ID: CD3KRQRNCW52CZHKG2GPQAEOU6UCL426YFNHYUZ7IWUUKAOTKUQX6UUX
  TIMELOCK_SHA256: 99a32170feaf3521338adfadb25d1a2ea573e6d29ec5de97e9d9cc3e4a99da97
  AUTHORITY_ID: GCQNLXZSQUYVFXYTWPA6RF6KIRTGQNZYHR4JIILXE3LTMXZQAUW6PXN5

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Stellar CLI
        uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4 # v27.0.0
        with:
          version: '27.0.0'
      - name: Fetch live contracts and require exact reviewed bytes
        run: |
          set -euo pipefail
          stellar --no-cache contract fetch \
            --id "$REGISTRY_ID" \
            --rpc-url "$RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            --out-file "$RUNNER_TEMP/mandate_registry.wasm"
          stellar --no-cache contract fetch \
            --id "$TIMELOCK_ID" \
            --rpc-url "$RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            --out-file "$RUNNER_TEMP/ackrate_timelock_controller.wasm"
          echo "$REGISTRY_SHA256  $RUNNER_TEMP/mandate_registry.wasm" | sha256sum --check --strict
          echo "$TIMELOCK_SHA256  $RUNNER_TEMP/ackrate_timelock_controller.wasm" | sha256sum --check --strict
      - name: Require the live 2-of-3 signer set and manifest identity
        run: |
          set -euo pipefail
          manifest='contracts/mainnet/deployment-manifest.json'
          test "$(jq -r '.deployment.registry_contract_id' "$manifest")" = "$REGISTRY_ID"
          test "$(jq -r '.deployment.timelock_contract_id' "$manifest")" = "$TIMELOCK_ID"
          test "$(jq -r '.public_configuration.authority_2_of_3_account' "$manifest")" = "$AUTHORITY_ID"
          curl --fail --silent --show-error \
            "https://horizon.stellar.org/accounts/$AUTHORITY_ID" \
            --output "$RUNNER_TEMP/authority.json"
          jq --exit-status --slurpfile manifest "$manifest" '
            .thresholds.low_threshold == 2 and
            .thresholds.med_threshold == 2 and
            .thresholds.high_threshold == 2 and
            ([.signers[] | select(.type == "ed25519_public_key") | .key] | sort) ==
              ($manifest[0].authority.signers | sort) and
            ([.signers[] | select(.type == "ed25519_public_key") | .weight] | sort) == [1, 1, 1]
          ' "$RUNNER_TEMP/authority.json"
      - name: Validate completed release evidence schema
        run: node scripts/check-mainnet-artifacts.mjs --release-dir "$RUNNER_TEMP"
