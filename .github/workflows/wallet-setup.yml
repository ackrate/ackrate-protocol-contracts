name: Atomic Wallet Setup
on:
  pull_request:
    paths:
      - 'contracts/wallet-setup/**'
      - 'contracts/mainnet-v2/mandate-registry/**'
      - '.github/workflows/wallet-setup.yml'
  push:
    branches: [main, feat/atomic-wallet-setup]
    paths:
      - 'contracts/wallet-setup/**'
      - 'contracts/mainnet-v2/mandate-registry/**'
      - '.github/workflows/wallet-setup.yml'
permissions:
  contents: read
concurrency:
  group: wallet-setup-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/wallet-setup
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target wasm32v1-none
      - run: cargo +1.98.0 fmt --check
      - run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.98.0 test --locked
      - run: cargo +1.98.0 build --locked --release --target wasm32v1-none
