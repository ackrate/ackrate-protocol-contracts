name: Build and Release
on:
  push:
    tags:
      - 'v0.1.*'
      - 'simple-v*'
      - 'composites-v*'
      - 'mainnet-canary-v*'
      - 'mainnet-v*'
      - 'mainnet-v2*'
      - 'mainnet-registry-v*'
      - 'source-verify-v*'
      - 'source-verify-registry-v*'
permissions:
  id-token: write
  contents: write
  attestations: write
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require one unambiguous release route
        id: route
        run: |
          route="$(bash scripts/release-tag-route.sh "$GITHUB_REF_NAME")"
          echo "route=$route" >> "$GITHUB_OUTPUT"

  gatecheck:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust contract toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target wasm32v1-none
      - name: Install verified Stellar CLI 27.0.0 release
        env:
          STELLAR_CLI_SHA256: 357bf712f6353c28cd33c794402a3c87231757a5b305e6ef1604365af4fdd556
        run: |
          archive="$RUNNER_TEMP/stellar-cli-27.0.0.tar.gz"
          bin_dir="$RUNNER_TEMP/stellar-cli-bin"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$STELLAR_CLI_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/stellar" --version
      - name: Install pinned dependency scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce Mainnet dependency security policy
        run: ./scripts/security-scan.sh
      - name: Gatecheck both contracts
        env:
          ACKRATE_CANONICAL_RELEASE_BUILD: '1'
        run: ./scripts/gatecheck-contracts.sh

  release-composites-mandate-registry:
    needs: [validate-tag, gatecheck]
    if: needs.validate-tag.outputs.route == 'composites'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@e43b241f114bcf02151c30d61088506c6ad3ae0b # v25.1.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Composite MandateRegistry contract release'
      relative_path: 'contracts/composites/mandate-registry'
      package: 'mandate-registry'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-simple-mandate-registry:
    needs: [validate-tag, gatecheck]
    if: needs.validate-tag.outputs.route == 'simple'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@e43b241f114bcf02151c30d61088506c6ad3ae0b # v25.1.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Simple MandateRegistry contract release'
      relative_path: 'contracts/simple/mandate-registry'
      package: 'mandate-registry'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  gatecheck-mainnet-contracts:
    needs: [validate-tag, gatecheck]
    if: contains(fromJSON('["mainnet-bundle", "mainnet-registry", "source-bundle", "source-registry"]'), needs.validate-tag.outputs.route)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust contract toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target wasm32v1-none
      - name: Check governed mainnet contracts
        run: |
          for manifest in \
            contracts/mainnet/timelock-controller/Cargo.toml \
            contracts/mainnet/mandate-registry/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
            cargo clippy --manifest-path "$manifest" --locked --all-targets -- -D warnings
            cargo test --manifest-path "$manifest" --locked
          done

  release-mainnet-timelock-controller:
    needs: [validate-tag, gatecheck-mainnet-contracts]
    if: needs.validate-tag.outputs.route == 'mainnet-bundle'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Ackrate governed mainnet Timelock Controller release'
      relative_path: 'contracts/mainnet/timelock-controller'
      package: 'ackrate-timelock-controller'
      home_domain: 'ackrate.xyz'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-mainnet-mandate-registry:
    needs: [validate-tag, gatecheck-mainnet-contracts]
    if: needs.validate-tag.outputs.route == 'mainnet-bundle' || needs.validate-tag.outputs.route == 'mainnet-registry'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Ackrate governed mainnet MandateRegistry release'
      relative_path: 'contracts/mainnet/mandate-registry'
      package: 'mandate-registry'
      home_domain: 'ackrate.xyz'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  exact-byte-source-verification:
    needs: [validate-tag, gatecheck]
    if: needs.validate-tag.outputs.route == 'source-bundle' || needs.validate-tag.outputs.route == 'source-registry'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned contract toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target wasm32v1-none
      - name: Install pinned Stellar CLI
        uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4 # v27.0.0
        with:
          version: '27.0.0'
      - name: Reproduce and require deployed bytes
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/ackrate-source-verification"
          mkdir -p "$output"
          (
            cd contracts/mainnet/timelock-controller
            stellar contract build --optimize \
              --locked \
              --package ackrate-timelock-controller \
              --out-dir "$output" \
              --meta source_repo=github:ackrate/ackrate-protocol-contracts \
              --meta home_domain=ackrate.xyz
          )
          (
            cd contracts/mainnet/mandate-registry
            stellar contract build --optimize \
              --locked \
              --package mandate-registry \
              --out-dir "$output" \
              --meta source_repo=github:ackrate/ackrate-protocol-contracts \
              --meta home_domain=ackrate.xyz
          )
          echo '99a32170feaf3521338adfadb25d1a2ea573e6d29ec5de97e9d9cc3e4a99da97  ackrate_timelock_controller.wasm' > "$output/SHA256SUMS"
          echo '3656430ac7cf5e7cf1c26948b46314c37866c2d7e928ea89d7d1f89b8aa0ef3c  mandate_registry.wasm' >> "$output/SHA256SUMS"
          cd "$output"
          sha256sum --check SHA256SUMS

  source-verify-timelock-controller:
    needs: [validate-tag, exact-byte-source-verification]
    if: needs.validate-tag.outputs.route == 'source-bundle'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Source-verification release for the deployed Ackrate mainnet TimelockController'
      relative_path: 'contracts/mainnet/timelock-controller'
      package: 'ackrate-timelock-controller'
      home_domain: 'ackrate.xyz'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  source-verify-mandate-registry:
    needs: [validate-tag, exact-byte-source-verification]
    if: needs.validate-tag.outputs.route == 'source-bundle' || needs.validate-tag.outputs.route == 'source-registry'
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # v27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Source-verification release for the deployed Ackrate mainnet MandateRegistry'
      relative_path: 'contracts/mainnet/mandate-registry'
      package: 'mandate-registry'
      home_domain: 'ackrate.xyz'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
