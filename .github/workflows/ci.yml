name: Contract Gate Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust contract toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32v1-none
      - name: Gate check both contracts
        run: ./scripts/gatecheck-contracts.sh

  mainnet-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust contract toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32v1-none
      - name: Install verified Stellar CLI 26.1.0 release
        env:
          STELLAR_CLI_SHA256: e18d5a7629102e1ccc07241acbcbebfc05b1c02476ce7d3204ba2d7418be5c0c
        run: |
          archive="$RUNNER_TEMP/stellar-cli-26.1.0.tar.gz"
          bin_dir="$RUNNER_TEMP/stellar-cli-bin"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/stellar/stellar-cli/releases/download/v26.1.0/stellar-cli-26.1.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$STELLAR_CLI_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/stellar" --version
      - name: Gate check governed mainnet candidate
        run: ./scripts/gatecheck-mainnet.sh
