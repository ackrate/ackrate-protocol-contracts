name: Contract Gate Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust contract toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target wasm32v1-none
      - name: Install pinned dependency scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce Mainnet dependency security policy
        run: ./scripts/security-scan.sh

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust contract toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target wasm32v1-none
      - name: Install Stellar CLI for optimized mainnet-v2 builds
        env:
          STELLAR_CLI_SHA256: 357bf712f6353c28cd33c794402a3c87231757a5b305e6ef1604365af4fdd556
        run: |
          archive="$RUNNER_TEMP/stellar-cli-27.0.0.tar.gz"
          bin_dir="$RUNNER_TEMP/stellar-cli-bin"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$STELLAR_CLI_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/stellar" --version
      - name: Gate check all current contract suites
        run: ./scripts/gatecheck-contracts.sh

  mainnet-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read reviewed source identity
        id: reviewed-source
        run: |
          source_commit="$(jq -r '.source.commit' contracts/mainnet/deployment-manifest.template.json)"
          rust_toolchain="$(jq -r '.source.rust_toolchain_version' contracts/mainnet/deployment-manifest.template.json)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$rust_toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain=$rust_toolchain" >> "$GITHUB_OUTPUT"
      - name: Check out exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.reviewed-source.outputs.commit }}
          path: reviewed-source
      - name: Install Rust contract toolchain
        run: rustup toolchain install ${{ steps.reviewed-source.outputs.rust_toolchain }} --profile minimal --component clippy,rustfmt --target wasm32v1-none
      - name: Install verified Stellar CLI 27.0.0 release
        env:
          STELLAR_CLI_SHA256: 357bf712f6353c28cd33c794402a3c87231757a5b305e6ef1604365af4fdd556
        run: |
          archive="$RUNNER_TEMP/stellar-cli-27.0.0.tar.gz"
          bin_dir="$RUNNER_TEMP/stellar-cli-bin"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$STELLAR_CLI_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/stellar" --version
      - name: Gate check governed mainnet candidate
        env:
          ACKRATE_MAINNET_SOURCE_ROOT: ${{ github.workspace }}/reviewed-source
        run: ./scripts/gatecheck-mainnet.sh
      - name: Publish exact governed mainnet artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainnet-release-${{ github.sha }}
          path: |
            target/mainnet-release/ackrate_timelock_controller.wasm
            target/mainnet-release/mandate_registry.wasm
            target/mainnet-release/ackrate_timelock_controller.interface.json
            target/mainnet-release/mandate_registry.interface.json
            target/mainnet-release/SHA256SUMS
            target/mainnet-release/SIZES
          if-no-files-found: error
          retention-days: 90
